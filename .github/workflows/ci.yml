name: Spring Boot CI (Gradle)

on:
  push:
    branches: [  master ]
  pull_request:
    branches: [  master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Tests with Gradle Wrapper
        run: ./gradlew test
