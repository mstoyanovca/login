# REQUIRED FOR OPENSHIFT: Move pid file to an unprivileged directory
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # REQUIRED FOR OPENSHIFT: Relocate temporary paths away from root-only directories
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    server {
        # REQUIRED FOR OPENSHIFT: Ports below 1024 require root privileges. Use 8080 or 8081.
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            # CRITICAL FOR ANGULAR: Redirects fallback paths to index.html for client-side routing
            try_files $uri $uri/ /index.html;
        }

        # Optional: Handle NGINX global error pages safely
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
