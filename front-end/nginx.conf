# OpenShift runs containers as arbitrary user IDs, so pid must be in a writable path
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Write temporary files to paths where the arbitrary OpenShift user has access
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;
    error_log   /dev/stderr  warn;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for optimized Angular performance
    gzip on;
    gzip_minimum_length 1000;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        # OpenShift does not permit root users to bind to privileged ports (<1024)
        listen 8080;
        server_name localhost;

        # Ensure this directory matches where your build files are copied in the Dockerfile
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Essential fallback block for Angular's client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Prevent browser caching for index.html to ensure users get immediate updates
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Redirect standard server error pages to static files
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
