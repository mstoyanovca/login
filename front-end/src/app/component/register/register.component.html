<div class="container-fluid">
    <form>
        <div class="form-group m-4">
            <h4>Register</h4>
        </div>
        <div class="form-group mx-4 col col-lg-4 col-md-6">
            <label for="firstName">First name</label>
            <input type="email" class="form-control form-control-sm" id="firstName">
        </div>
        <div class="form-group mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="lastName">Last name</label>
            <input type="email" class="form-control form-control-sm" id="lastName">
        </div>
        <div class="form-group mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="email">Email</label>
            <input type="email" class="form-control form-control-sm" id="email">
        </div>
        <div class="mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-sm" id="password">
                <span class="input-group-text">
                    <i class="fa fa-regular fa-eye-slash"></i>
                </span>
            </div>
        </div>
        <div class="mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="confirmedPassword">Password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-sm" id="confirmedPassword">
                <span class="input-group-text">
                    <i class="fa fa-regular fa-eye"></i>
                </span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary ms-4 mt-3">Submit</button>
    </form>

    <nav class="navbar fixed-bottom bg-body-tertiary">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand" href="#">Written by Martin Stoyanov, April 2025</a>
        </div>
    </nav>
</div>
