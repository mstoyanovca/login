<div class="container-fluid">
    <h4 class="m-4">Register</h4>

    <form #registerForm="ngForm">
        <div class="form-group mx-4 col col-lg-4 col-md-6">
            <label for="firstName">First name</label>
            <input type="text" class="form-control form-control-sm" id="firstName" name="firstName" [(ngModel)]="user.firstName" required>
        </div>
        <div class="form-group mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="lastName">Last name</label>
            <input type="text" class="form-control form-control-sm" id="lastName" required>
        </div>
        <div class="form-group mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="email">Email</label>
            <input type="email" class="form-control form-control-sm" id="email" required>
        </div>
        <div class="mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-sm" id="password" required>
                <span class="input-group-text">
                    <i class="fa fa-regular fa-eye-slash"></i>
                </span>
            </div>
        </div>
        <div class="mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="confirmedPassword">Confirm password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-sm" id="confirmedPassword" required>
                <span class="input-group-text">
                    <i class="fa fa-regular fa-eye"></i>
                </span>
            </div>
        </div>
        <div class="form-group ms-4 mt-3">
            <button type="submit" class="btn btn-primary btn-sm">Submit</button>
        </div>
    </form>

    <nav class="navbar fixed-bottom bg-body-tertiary">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand" href="#">Written by Martin Stoyanov, April 2025</a>
        </div>
    </nav>
</div>
