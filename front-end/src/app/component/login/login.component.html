<div class="container-fluid">
    <form>
        <div class="form-group m-4">
            <h4>Login, or create an account</h4>
            <p>This is my Angular 19, Bootstrap 5, Java 17 and Spring Boot 3 playground.</p>
        </div>
        <div class="form-group mx-4 col col-lg-4 col-md-6">
            <label for="email">Email</label>
            <input type="email" class="form-control form-control-sm" id="email">
        </div>
        <div class="mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="password">Password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-sm" id="password">
                <span class="input-group-text">
                    <i class="fa fa-regular fa-eye-slash"></i>
                </span>
            </div>
        </div>
        <div class="form-group mx-4 mt-3 col col-lg-4 col-md-6">
            <button type="submit" class="btn btn-primary">Submit</button>
            <a routerLink="forgot-password" class="btn btn-link pe-0 float-end">Forgot password</a>
            <a routerLink="register" class="btn btn-link float-end">Register</a>
        </div>
    </form>

    <nav class="navbar fixed-bottom bg-body-tertiary">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand" href="#">Written by Martin Stoyanov, April 2025</a>
        </div>
    </nav>
</div>
