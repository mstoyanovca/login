<div class="container-fluid">
    <form>
        <div class="form-group m-4">
            <h4>Login, or create an account.</h4>
            <p>This is my Angular 19, Bootstrap 5, Java 17 and Spring Boot 3 playground.</p>
        </div>
        <div class="form-group mx-4 col col-lg-4 col-md-6">
            <label for="exampleInputEmail1">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                   placeholder="Enter email">
        </div>
        <div class="form-group mx-4 mt-2 col col-lg-4 col-md-6">
            <label for="exampleInputPassword1">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
        </div>
        <button type="submit" class="btn btn-primary ms-4 mt-3">Submit</button>
    </form>
</div>
